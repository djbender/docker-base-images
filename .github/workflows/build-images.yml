name: Build Images

on:
  push:
    branches:
      - main
  pull_request:
  # Weekly full build: safety net for anything change detection might skip
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

# New pushes cancel superseded PR runs; main runs go one at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1.343.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run RSpec
        run: bundle exec rspec

      - name: Run RuboCop
        run: bundle exec rubocop lib/ spec/ rakelib/

      - name: Verify generated files are up to date
        run: |
          bundle exec rake generate:all
          git diff --exit-code

      - name: Verify actions lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.5.1
          gh actions-lock --verify

  set-matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      build_core: ${{ steps.set-matrix.outputs.build_core }}
      build_common: ${{ steps.set-matrix.outputs.build_common }}
      core_matrix: ${{ steps.set-matrix.outputs.core_matrix }}
      common_matrix: ${{ steps.set-matrix.outputs.common_matrix }}
      core_merge_matrix: ${{ steps.set-matrix.outputs.core_merge_matrix }}
      common_merge_matrix: ${{ steps.set-matrix.outputs.common_merge_matrix }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the change base must be available to diff against

      - uses: ruby/setup-ruby@v1.343.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # PRs compare against their base; main compares against its last successful
      # run, so changes from a failed or cancelled run are built next time.
      # An empty result builds everything.
      - name: Find change base
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$PR_BASE" ]]; then
            sha=$PR_BASE
          else
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-images.yml/runs?branch=main&status=success&per_page=20" \
              --jq '[.workflow_runs[] | select(.event != "pull_request")][0].head_sha // empty') || sha=""
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Set matrix output
        id: set-matrix
        env:
          CHANGE_BASE: ${{ steps.base.outputs.sha }}
        run: |
          echo ${{ github.ref }}
          core_matrix=$(bundle exec rake ci:set-matrix:core)
          echo "$core_matrix" | jq .
          echo "core_matrix=$core_matrix" >> $GITHUB_OUTPUT
          echo "build_core=$(echo "$core_matrix" | jq '.include | length > 0')" >> "$GITHUB_OUTPUT"

          common_matrix=$(bundle exec rake ci:set-matrix:common)
          echo "$common_matrix" | jq .
          echo "common_matrix=$common_matrix" >> $GITHUB_OUTPUT
          echo "build_common=$(echo "$common_matrix" | jq '.include | length > 0')" >> "$GITHUB_OUTPUT"

          core_merge_matrix=$(bundle exec rake ci:set-matrix:core-merge)
          echo "$core_merge_matrix" | jq .
          echo "core_merge_matrix=$core_merge_matrix" >> $GITHUB_OUTPUT

          common_merge_matrix=$(bundle exec rake ci:set-matrix:common-merge)
          echo "$common_merge_matrix" | jq .
          echo "common_merge_matrix=$common_merge_matrix" >> $GITHUB_OUTPUT

  build-core-images:
    runs-on: ${{ matrix.runner }}
    needs:
      - set-matrix
    if: needs.set-matrix.outputs.build_core == 'true'
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.set-matrix.outputs.core_matrix) }}
    timeout-minutes: 20
    steps:
      - name: set PWD environment variable
        run: echo "PWD=$(pwd)" >> $GITHUB_ENV

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push primary images
        uses: docker/bake-action@v7.5.0
        with:
          pull: true
          push: ${{ github.ref == 'refs/heads/main' }}
          files: ${{ matrix.bake }}
          targets: ${{ matrix.primary_target }}
          source: .
          set: |
            ${{ matrix.primary_cache_from }}
            ${{ matrix.primary_cache_to }}
            *.platform=${{ matrix.platform }}
            *.tags=${{ matrix.registry }}/${{ matrix.primary_target }}:${{ matrix.version }}-${{ github.run_id }}-${{ matrix.arch }}

      - name: Build and push dev images
        uses: docker/bake-action@v7.5.0
        with:
          pull: true
          push: ${{ github.ref == 'refs/heads/main' }}
          files: ${{ matrix.bake }}
          targets: ${{ matrix.dev_target }}
          source: .
          set: |
            ${{ matrix.dev_cache_from }}
            ${{ matrix.dev_cache_to }}
            *.platform=${{ matrix.platform }}
            *.tags=${{ matrix.registry }}/${{ matrix.primary_target }}:${{ matrix.version }}-dev-${{ github.run_id }}-${{ matrix.arch }}

  merge-core-manifests:
    runs-on: ubuntu-slim
    needs:
      - set-matrix
      - build-core-images
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.build-core-images.result == 'success' }}
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.set-matrix.outputs.core_merge_matrix) }}
    env:
      IMAGE_BASE: ${{ matrix.registry }}/${{ matrix.primary_target }}:${{ matrix.version }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        run: |
          create_manifest() {
            local tag=$1 suffix=$2
            echo "Creating manifest for $tag"
            docker buildx imagetools create -t "$tag" \
              "${IMAGE_BASE}${suffix}-${{ github.run_id }}-amd64" \
              "${IMAGE_BASE}${suffix}-${{ github.run_id }}-arm64"
          }
          for tag in ${{ matrix.primary_tags }}; do create_manifest "$tag" ""; done
          for tag in ${{ matrix.dev_tags }}; do create_manifest "$tag" "-dev"; done

  build-common-images:
    runs-on: ${{ matrix.runner }}
    needs:
      - set-matrix
      - build-core-images
    # core is skipped when unchanged; that must not skip this job
    if: ${{ !cancelled() && needs.set-matrix.outputs.build_common == 'true' && contains(fromJSON('["success","skipped"]'), needs.build-core-images.result) }}
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.set-matrix.outputs.common_matrix) }}
    timeout-minutes: 60
    steps:
      - name: set PWD environment variable
        run: echo "PWD=$(pwd)" >> $GITHUB_ENV

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push primary images
        uses: docker/bake-action@v7.5.0
        with:
          pull: true
          push: ${{ github.ref == 'refs/heads/main' }}
          files: ${{ matrix.bake }}
          targets: ${{ matrix.primary_target }}
          source: .
          set: |
            ${{ matrix.primary_cache_from }}
            ${{ matrix.primary_cache_to }}
            *.platform=${{ matrix.platform }}
            *.tags=${{ matrix.registry }}/${{ matrix.primary_target }}:${{ matrix.version }}-${{ github.run_id }}-${{ matrix.arch }}

      - name: Build and push dev images
        uses: docker/bake-action@v7.5.0
        with:
          pull: true
          push: ${{ github.ref == 'refs/heads/main' }}
          files: ${{ matrix.bake }}
          targets: ${{ matrix.dev_target }}
          source: .
          set: |
            ${{ matrix.dev_cache_from }}
            ${{ matrix.dev_cache_to }}
            *.platform=${{ matrix.platform }}
            *.tags=${{ matrix.registry }}/${{ matrix.primary_target }}:${{ matrix.version }}-dev-${{ github.run_id }}-${{ matrix.arch }}

  merge-common-manifests:
    runs-on: ubuntu-slim
    needs:
      - set-matrix
      - build-common-images
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.build-common-images.result == 'success' }}
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.set-matrix.outputs.common_merge_matrix) }}
    env:
      IMAGE_BASE: ${{ matrix.registry }}/${{ matrix.primary_target }}:${{ matrix.version }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        run: |
          create_manifest() {
            local tag=$1 suffix=$2
            echo "Creating manifest for $tag"
            docker buildx imagetools create -t "$tag" \
              "${IMAGE_BASE}${suffix}-${{ github.run_id }}-amd64" \
              "${IMAGE_BASE}${suffix}-${{ github.run_id }}-arm64"
          }
          for tag in ${{ matrix.primary_tags }}; do create_manifest "$tag" ""; done
          for tag in ${{ matrix.dev_tags }}; do create_manifest "$tag" "-dev"; done

  ci:
    runs-on: ubuntu-slim
    needs:
      - test
      - set-matrix
      - build-core-images
      - build-common-images
      - merge-core-manifests
      - merge-common-manifests
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          results="${{ needs.test.result }} ${{ needs.set-matrix.result }} ${{ needs.build-core-images.result }} ${{ needs.build-common-images.result }}"
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            results="$results ${{ needs.merge-core-manifests.result }} ${{ needs.merge-common-manifests.result }}"
          fi
          for result in $results; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "One or more jobs failed: $results"
              exit 1
            fi
          done
          echo "All jobs passed"
